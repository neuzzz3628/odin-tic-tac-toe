<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="javascript.js" referrerpolicy="no-referrer" defer></script>
    <title>Plain Tic-Tac-Toe</title>
</head>
<body>
    <div class="container">
        <h1 class="turn"></h1>
        <div class="board"></div>
        <dialog id="names">
            <form method="dialog">
                <label for="playerOne">Player One:
                    <input type="text" name="playerOne" id="playerOne" placeholder="Player One">
                </label>
                <label for="playerTwo">Player Two:
                    <input type="text" name="playerTwo" id="playerOne" placeholder="Player Two">
                </label>
                <button>Start</button>
            </form>
        </dialog>
        <dialog id="restart">
            <h2></h2>
            <button autofocus>Restart</button>
        </dialog>
   </div>
</body>
</html>
